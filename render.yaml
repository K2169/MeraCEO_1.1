services:
  - type: web
    name: meraceo-api-staging
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: "commit"
    buildCommand: corepack enable && pnpm install --filter @meraceo/api... --frozen-lockfile --prod=false
    startCommand: pnpm --filter @meraceo/api start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: meraceo_staging
      - key: SESSION_JWT_SECRET
        generateValue: true
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: SUPPORT_EMAIL
        value: krishnam@meraceo.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
